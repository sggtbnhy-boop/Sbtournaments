<!DOCTYPE html><html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0"><title>SB Tournament - Match History</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
    font-family:Arial,sans-serif;
}

body{
    background:#f4f6fb;
    color:#222;
}

.header{
    background:#171a2b;
    color:white;
    padding:18px;
    text-align:center;
}

.header h1{
    font-size:24px;
}

.container{
    width:94%;
    max-width:1000px;
    margin:25px auto;
}

.back{
    display:inline-block;
    margin-bottom:15px;
    color:#2563eb;
    text-decoration:none;
    font-weight:bold;
}

.summary{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:12px;
    margin-bottom:20px;
}

.stat{
    background:white;
    padding:18px;
    border-radius:12px;
    text-align:center;
    box-shadow:0 4px 15px rgba(0,0,0,.07);
}

.stat h3{
    font-size:25px;
    margin-bottom:5px;
}

.stat p{
    color:#777;
    font-size:14px;
}

.card{
    background:white;
    padding:20px;
    margin-bottom:20px;
    border-radius:14px;
    box-shadow:0 4px 15px rgba(0,0,0,.08);
}

.card h2{
    margin-bottom:15px;
}

.match{
    border:1px solid #e5e7eb;
    border-radius:12px;
    padding:16px;
    margin-top:14px;
}

.match h3{
    margin-bottom:10px;
}

.info{
    line-height:1.8;
    color:#555;
    margin-top:10px;
}

.status{
    display:inline-block;
    padding:5px 10px;
    border-radius:20px;
    font-size:13px;
    font-weight:bold;
}

.upcoming{
    background:#fff7ed;
    color:#c2410c;
}

.live{
    background:#dcfce7;
    color:#15803d;
}

.completed{
    background:#e5e7eb;
    color:#374151;
}

.copy{
    margin-top:12px;
    background:#16a34a;
    color:white;
    border:0;
    padding:10px 14px;
    border-radius:8px;
    font-weight:bold;
}

.empty,
.loading,
.error{
    text-align:center;
    padding:25px;
}

.empty{
    color:#777;
}

.loading{
    color:#555;
}

.error{
    color:#dc2626;
}

@media(max-width:600px){

    .summary{
        grid-template-columns:1fr;
    }

    .card{
        padding:16px;
    }

}
</style></head><body><div class="header">
    <h1>🏆 SB Tournament</h1>
    <p>P6 — Match History</p>
</div><div class="container"><a class="back" href="index.html">
    ← Back to Home
</a>


<div class="summary">

    <div class="stat">
        <h3 id="totalMatches">0</h3>
        <p>Total Matches</p>
    </div>

    <div class="stat">
        <h3 id="upcomingMatches">0</h3>
        <p>Upcoming</p>
    </div>

    <div class="stat">
        <h3 id="completedMatches">0</h3>
        <p>Completed</p>
    </div>

</div>


<div class="card">

    <h2>📋 Match History</h2>

    <div id="matchList">

        <div class="loading">
            Match loading...
        </div>

    </div>

</div>

</div><script>

/* =========================
   SUPABASE CONFIG
========================= */

const SUPABASE_URL =
"https://ofcpuiubovcjxucqynyw.supabase.co";

const SUPABASE_KEY =
"sb_publishable_NpG4P_VRdesJJkkzuBoanw_mbM3ivFS";

const supabaseClient =
supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
);


/* =========================
   LOAD MATCH HISTORY
========================= */

async function loadMatchHistory(){

    const list =
        document.getElementById("matchList");


    list.innerHTML =
        `<div class="loading">
            Match loading...
        </div>`;


    const { data, error } =
        await supabaseClient
        .from("matches")
        .select("*")
        .order("id", {
            ascending:false
        });


    if(error){

        console.error(error);

        list.innerHTML =
        `<div class="error">
            ❌ Match history load করা যায়নি।<br><br>
            ${escapeHTML(error.message)}
        </div>`;

        return;
    }


    const matches = data || [];


    updateSummary(matches);

    renderHistory(matches);
}


/* =========================
   SUMMARY
========================= */

function updateSummary(matches){

    const total =
        matches.length;


    const upcoming =
        matches.filter(
            match => match.status === "Upcoming"
        ).length;


    const completed =
        matches.filter(
            match => match.status === "Completed"
        ).length;


    document.getElementById(
        "totalMatches"
    ).textContent = total;


    document.getElementById(
        "upcomingMatches"
    ).textContent = upcoming;


    document.getElementById(
        "completedMatches"
    ).textContent = completed;
}


/* =========================
   RENDER HISTORY
========================= */

function renderHistory(matches){

    const list =
        document.getElementById("matchList");


    if(matches.length === 0){

        list.innerHTML =
        `<div class="empty">
            এখনো কোনো Match History নেই।
        </div>`;

        return;
    }


    list.innerHTML =
        matches.map(match => {

            let statusClass =
                "upcoming";


            if(match.status === "Live"){
                statusClass = "live";
            }


            if(match.status === "Completed"){
                statusClass = "completed";
            }


            return `

            <div class="match">

                <h3>
                    🏆
                    ${escapeHTML(match.tournament)}
                </h3>


                <span class="status ${statusClass}">
                    ${escapeHTML(match.status)}
                </span>


                <div class="info">

                    📅 Date:
                    ${escapeHTML(match.date)}

                    <br>

                    🕐 Time:
                    ${escapeHTML(match.time)}

                    <br>

                    🔑 Room ID:
                    ${escapeHTML(match.room)}

                    <br>

                    🔒 Password:
                    ${escapeHTML(match.password)}

                </div>


                <button
                    class="copy"
                    onclick="copyText('${safeJS(match.room)}')">

                    📋 Copy Room ID

                </button>

            </div>

            `;

        }).join("");
}


/* =========================
   COPY
========================= */

async function copyText(text){

    try{

        await navigator.clipboard.writeText(text);

        alert("✅ Room ID Copied!");

    }catch(error){

        alert(
            "Room ID copy করা যায়নি।"
        );
    }
}


/* =========================
   SECURITY
========================= */

function escapeHTML(text){

    return String(text ?? "")
        .replace(/&/g,"&amp;")
        .replace(/</g,"&lt;")
        .replace(/>/g,"&gt;")
        .replace(/"/g,"&quot;")
        .replace(/'/g,"&#039;");
}


function safeJS(text){

    return String(text ?? "")
        .replace(/\\/g,"\\\\")
        .replace(/'/g,"\\'")
        .replace(/\r/g,"\\r")
        .replace(/\n/g,"\\n");
}


/* =========================
   START
========================= */

loadMatchHistory();

</script></body>
      </html>
