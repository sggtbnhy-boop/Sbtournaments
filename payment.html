<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>SB Tournament - Payment</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
    }

    body {
      background: #f3f4f6;
      color: #111827;
      min-height: 100vh;
    }

    header {
      background: #111827;
      color: white;
      padding: 20px;
      text-align: center;
    }

    header h1 {
      font-size: 25px;
      margin-bottom: 5px;
    }

    header p {
      color: #cbd5e1;
      font-size: 14px;
    }

    .container {
      width: 92%;
      max-width: 600px;
      margin: 30px auto;
    }

    .card {
      background: white;
      padding: 25px;
      border-radius: 15px;
      box-shadow: 0 5px 20px rgba(0,0,0,0.08);
    }

    h2 {
      text-align: center;
      margin-bottom: 20px;
    }

    .payment-info {
      background: #f9fafb;
      border-radius: 10px;
      padding: 15px;
      margin-bottom: 20px;
    }

    .payment-info p {
      margin: 8px 0;
      font-size: 14px;
    }

    .number {
      font-weight: bold;
      font-size: 17px;
    }

    label {
      display: block;
      margin: 12px 0 7px;
      font-weight: bold;
      font-size: 14px;
    }

    input,
    select {
      width: 100%;
      padding: 13px;
      border: 1px solid #d1d5db;
      border-radius: 8px;
      font-size: 15px;
      outline: none;
    }

    input:focus,
    select:focus {
      border-color: #2563eb;
    }

    button {
      width: 100%;
      margin-top: 20px;
      padding: 13px;
      border: none;
      border-radius: 8px;
      background: #2563eb;
      color: white;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }

    button:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    .message {
      display: none;
      margin-top: 15px;
      padding: 12px;
      border-radius: 8px;
      text-align: center;
      font-size: 14px;
    }

    .success {
      background: #dcfce7;
      color: #166534;
    }

    .error {
      background: #fee2e2;
      color: #991b1b;
    }

    .status-link {
      display: none;
      margin-top: 15px;
      text-align: center;
      color: #2563eb;
      font-weight: bold;
      text-decoration: none;
    }

    .home-link {
      display: block;
      margin-top: 20px;
      text-align: center;
      color: #2563eb;
      text-decoration: none;
      font-weight: bold;
    }
  </style>
</head>

<body>

<header>
  <h1>SB Tournament</h1>
  <p>Secure Payment Submission</p>
</header>

<div class="container">

  <div class="card">

    <h2>Submit Payment</h2>

    <div class="payment-info">

      <p>
        <strong>bKash Personal:</strong>
        <span class="number">01825265553</span>
      </p>

      <p>
        <strong>Nagad Personal:</strong>
        <span class="number">01703610065</span>
      </p>

      <p>
        Send the tournament fee to the selected number,
        then enter your Transaction ID below.
      </p>

    </div>

    <form id="paymentForm">

      <label for="playerName">
        Player Name
      </label>

      <input
        type="text"
        id="playerName"
        placeholder="Enter player name"
        required
      >

      <label for="phone">
        Your Phone Number
      </label>

      <input
        type="tel"
        id="phone"
        placeholder="01703610065"
        required
      >

      <label for="paymentMethod">
        Payment Method
      </label>

      <select id="paymentMethod" required>

        <option value="">
          Select payment method
        </option>

        <option value="bKash">
          bKash
        </option>

        <option value="Nagad">
          Nagad
        </option>

      </select>

      <label for="transactionId">
        Transaction ID
      </label>

      <input
        type="text"
        id="transactionId"
        placeholder="Enter Transaction ID"
        required
        autocomplete="off"
      >

      <label for="amount">
        Amount
      </label>

      <input
        type="number"
        id="amount"
        placeholder="Enter amount"
        min="1"
        required
      >

      <button
        type="submit"
        id="submitButton">
        Submit Payment
      </button>

    </form>

    <div
      id="successMessage"
      class="message success">
    </div>

    <div
      id="errorMessage"
      class="message error">
    </div>

    <a
      id="statusLink"
      class="status-link"
      href="payment-status.html">
      Check Payment Status →
    </a>

    <a
      class="home-link"
      href="index.html">
      ← Back to Home
    </a>

  </div>

</div>

<script>

  /* =====================================
     SUPABASE CONFIG
     ===================================== */

  const SUPABASE_URL =
    "https://ofcpuiubovcjxucqynyw.supabase.co";

  const SUPABASE_PUBLISHABLE_KEY =
    "sb_publishable_NpG4P_VRdesJJkkzuBoanw_mbM3ivFS";

  const supabaseClient =
    supabase.createClient(
      SUPABASE_URL,
      SUPABASE_PUBLISHABLE_KEY
    );


  /* =====================================
     FORM SUBMIT
     ===================================== */

  document
    .getElementById("paymentForm")
    .addEventListener(
      "submit",
      async function(event) {

        event.preventDefault();

        const submitButton =
          document.getElementById(
            "submitButton"
          );

        const successMessage =
          document.getElementById(
            "successMessage"
          );

        const errorMessage =
          document.getElementById(
            "errorMessage"
          );

        successMessage.style.display = "none";
        errorMessage.style.display = "none";

        const playerName =
          document
            .getElementById("playerName")
            .value
            .trim();

        const phone =
          document
            .getElementById("phone")
            .value
            .trim();

        const paymentMethod =
          document
            .getElementById("paymentMethod")
            .value;

        const transactionId =
          document
            .getElementById("transactionId")
            .value
            .trim();

        const amount =
          document
            .getElementById("amount")
            .value;


        if (
          !playerName ||
          !phone ||
          !paymentMethod ||
          !transactionId ||
          !amount
        ) {

          errorMessage.textContent =
            "Please fill in all fields.";

          errorMessage.style.display =
            "block";

          return;
        }


        submitButton.disabled = true;
        submitButton.textContent =
          "Submitting...";


        try {

          /* Check duplicate transaction ID */

          const { data: existingPayment,
                  error: checkError } =
            await supabaseClient
              .from("payments")
              .select("id")
              .eq(
                "transaction_id",
                transactionId
              )
              .limit(1);


          if (checkError) {
            throw checkError;
          }


          if (
            existingPayment &&
            existingPayment.length > 0
          ) {

            throw new Error(
              "This Transaction ID has already been submitted."
            );
          }


          /* Insert payment */

          const { data, error } =
            await supabaseClient
              .from("payments")
              .insert([
                {
                  player_name: playerName,
                  phone: phone,
                  payment_method: paymentMethod,
                  transaction_id: transactionId,
                  amount: amount,
                  status: "pending"
                }
              ])
              .select();


          if (error) {
            throw error;
          }


          /* Success */

          successMessage.textContent =
            "Payment submitted successfully! Your payment is now pending verification.";

          successMessage.style.display =
            "block";


          const statusLink =
            document.getElementById(
              "statusLink"
            );

          statusLink.style.display =
            "block";


          /* Keep transaction ID */

          document
            .getElementById(
              "transactionId"
            )
            .value = transactionId;


          document
            .getElementById(
              "paymentForm"
            )
            .reset();


        } catch (error) {

          console.error(error);

          errorMessage.textContent =
            error.message ||
            "Payment submission failed.";

          errorMessage.style.display =
            "block";

        } finally {

          submitButton.disabled = false;

          submitButton.textContent =
            "Submit Payment";
        }

      }
    );

</script>

</body>
    </html>
