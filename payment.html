<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SB Tournament - Payment</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
    }

    body {
      min-height: 100vh;
      padding: 20px;
      background: linear-gradient(135deg, #07111f, #172554);
      color: white;
    }

    .container {
      width: 100%;
      max-width: 500px;
      margin: auto;
    }

    .header {
      text-align: center;
      margin-bottom: 20px;
    }

    .header h1 {
      color: #38bdf8;
      font-size: 30px;
    }

    .header p {
      color: #cbd5e1;
      margin-top: 6px;
    }

    .card {
      background: rgba(15, 23, 42, 0.96);
      border: 1px solid #334155;
      border-radius: 18px;
      padding: 22px;
      box-shadow: 0 10px 30px rgba(0,0,0,.35);
    }

    .amount {
      text-align: center;
      padding: 15px;
      margin-bottom: 18px;
      border-radius: 12px;
      background: #082f49;
      border: 1px solid #0ea5e9;
    }

    .amount span {
      color: #bae6fd;
      font-size: 14px;
    }

    .amount h2 {
      color: #38bdf8;
      margin-top: 5px;
    }

    .payment-info {
      background: #111827;
      border-radius: 14px;
      padding: 16px;
      margin-bottom: 18px;
    }

    .payment-info h2 {
      font-size: 19px;
      margin-bottom: 12px;
    }

    .number-box {
      background: #020617;
      border: 1px solid #475569;
      border-radius: 10px;
      padding: 12px;
      margin-bottom: 10px;
    }

    .number-box strong {
      display: block;
      color: #94a3b8;
      font-size: 13px;
      margin-bottom: 5px;
    }

    .number {
      color: #38bdf8;
      font-size: 20px;
      font-weight: bold;
    }

    label {
      display: block;
      margin: 14px 0 7px;
      font-weight: bold;
      color: #e2e8f0;
    }

    input,
    select {
      width: 100%;
      padding: 13px;
      border-radius: 10px;
      border: 1px solid #475569;
      background: #020617;
      color: white;
      font-size: 15px;
      outline: none;
    }

    input:focus,
    select:focus {
      border-color: #38bdf8;
    }

    button {
      width: 100%;
      margin-top: 20px;
      padding: 14px;
      border: none;
      border-radius: 11px;
      background: #0ea5e9;
      color: white;
      font-size: 17px;
      font-weight: bold;
      cursor: pointer;
    }

    button:hover {
      background: #0284c7;
    }

    button:disabled {
      background: #475569;
      cursor: not-allowed;
    }

    .message {
      display: none;
      margin-top: 15px;
      padding: 12px;
      border-radius: 10px;
      text-align: center;
      font-size: 14px;
    }

    .success {
      display: block;
      background: #064e3b;
      border: 1px solid #10b981;
      color: #a7f3d0;
    }

    .error {
      display: block;
      background: #450a0a;
      border: 1px solid #ef4444;
      color: #fecaca;
    }

    .back {
      display: block;
      text-align: center;
      color: #38bdf8;
      text-decoration: none;
      margin-top: 18px;
    }

    .note {
      text-align: center;
      color: #94a3b8;
      font-size: 12px;
      line-height: 1.5;
      margin-top: 15px;
    }
  </style>
</head>

<body>

<div class="container">

  <div class="header">
    <h1>SB Tournament</h1>
    <p>Payment System P2</p>
  </div>

  <div class="card">

    <div class="amount">
      <span>Tournament Entry Fee</span>
      <h2>৳100</h2>
    </div>

    <div class="payment-info">
      <h2>Payment Number</h2>

      <div class="number-box">
        <strong>bKash</strong>
        <div class="number">01825265553</div>
      </div>

      <div class="number-box">
        <strong>Nagad</strong>
        <div class="number">01703610065</div>
      </div>
    </div>

    <form id="paymentForm">

      <label for="playerName">Player Name</label>
      <input
        type="text"
        id="playerName"
        placeholder="Enter player name"
        required
      >

      <label for="playerId">Player ID</label>
      <input
        type="text"
        id="playerId"
        placeholder="Enter player ID"
        required
      >

      <label for="method">Payment Method</label>
      <select id="method" required>
        <option value="">Select method</option>
        <option value="bKash">bKash</option>
        <option value="Nagad">Nagad</option>
      </select>

      <label for="amount">Payment Amount</label>
      <input
        type="number"
        id="amount"
        value="100"
        min="1"
        required
      >

      <label for="transactionId">Transaction ID</label>
      <input
        type="text"
        id="transactionId"
        placeholder="Enter transaction ID"
        required
      >

      <button type="submit" id="submitBtn">
        Submit Payment
      </button>

      <div id="message" class="message"></div>

    </form>

    <div class="note">
      Payment করার পর সঠিক Transaction ID দিন।
      Payment verification Admin করবে।
    </div>

    <a href="index.html" class="back">← Back to Home</a>

  </div>

</div>


<script>
  // =====================================
  // SUPABASE CONFIG
  // =====================================

  const SUPABASE_URL =
    "https://ofcpuiubovcjxucqynyw.supabase.co";

  const SUPABASE_PUBLISHABLE_KEY =
    "sb_publishable_NpG4P_VRdesJJkkzuBoanw_mbM3ivFS";

  const { createClient } = supabase;

  const db = createClient(
    SUPABASE_URL,
    SUPABASE_PUBLISHABLE_KEY
  );


  // =====================================
  // FORM
  // =====================================

  const form = document.getElementById("paymentForm");
  const button = document.getElementById("submitBtn");
  const message = document.getElementById("message");


  form.addEventListener("submit", async function(e) {

    e.preventDefault();

    message.className = "message";
    message.textContent = "";

    const playerName =
      document.getElementById("playerName").value.trim();

    const playerId =
      document.getElementById("playerId").value.trim();

    const paymentMethod =
      document.getElementById("method").value;

    const amount =
      Number(document.getElementById("amount").value);

    const transactionId =
      document.getElementById("transactionId").value.trim();


    if (
      !playerName ||
      !playerId ||
      !paymentMethod ||
      !amount ||
      !transactionId
    ) {
      message.className = "message error";
      message.textContent =
        "Please fill in all fields.";
      return;
    }


    button.disabled = true;
    button.textContent = "Submitting...";


    try {

      const { error } = await db
        .from("payments")
        .insert([
          {
            player_name: playerName,
            player_id: playerId,
            payment_method: paymentMethod,
            amount: amount,
            transaction_id: transactionId,
            status: "Pending"
          }
        ]);


      if (error) {
        throw error;
      }


      message.className = "message success";
      message.textContent =
        "Payment submitted successfully! Status: Pending.";

      form.reset();

      document.getElementById("amount").value = 100;

    } catch (error) {

      console.error(error);

      message.className = "message error";
      message.textContent =
        "Payment failed. Please check Supabase table and try again.";

    }


    button.disabled = false;
    button.textContent = "Submit Payment";

  });
</script>

</body>
          </html>
