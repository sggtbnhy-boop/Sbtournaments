<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SB Tournament - Payment Admin</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
    }

    body {
      background: #f4f6f8;
      color: #222;
    }

    header {
      background: #111827;
      color: white;
      padding: 18px;
      text-align: center;
    }

    header h1 {
      font-size: 24px;
      margin-bottom: 5px;
    }

    header p {
      color: #cbd5e1;
      font-size: 14px;
    }

    .container {
      width: 95%;
      max-width: 1100px;
      margin: 25px auto;
    }

    .top-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
      margin-bottom: 20px;
    }

    .top-bar h2 {
      font-size: 22px;
    }

    button {
      border: none;
      padding: 10px 15px;
      border-radius: 8px;
      cursor: pointer;
      font-weight: bold;
    }

    .refresh {
      background: #2563eb;
      color: white;
    }

    .message {
      padding: 12px;
      border-radius: 8px;
      margin-bottom: 15px;
      display: none;
    }

    .success {
      background: #dcfce7;
      color: #166534;
    }

    .error {
      background: #fee2e2;
      color: #991b1b;
    }

    .loading {
      text-align: center;
      padding: 30px;
      color: #555;
    }

    .table-box {
      background: white;
      border-radius: 12px;
      overflow-x: auto;
      box-shadow: 0 3px 15px rgba(0,0,0,0.08);
    }

    table {
      width: 100%;
      border-collapse: collapse;
      min-width: 900px;
    }

    th,
    td {
      padding: 13px;
      border-bottom: 1px solid #e5e7eb;
      text-align: left;
      font-size: 14px;
    }

    th {
      background: #f9fafb;
    }

    .status {
      padding: 5px 9px;
      border-radius: 20px;
      font-size: 12px;
      font-weight: bold;
      display: inline-block;
    }

    .pending {
      background: #fef3c7;
      color: #92400e;
    }

    .approved {
      background: #dcfce7;
      color: #166534;
    }

    .rejected {
      background: #fee2e2;
      color: #991b1b;
    }

    .approve {
      background: #16a34a;
      color: white;
      margin-right: 5px;
    }

    .reject {
      background: #dc2626;
      color: white;
    }

    .empty {
      text-align: center;
      padding: 35px;
      color: #666;
    }

    .stats {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 15px;
      margin-bottom: 20px;
    }

    .stat-card {
      background: white;
      padding: 18px;
      border-radius: 12px;
      box-shadow: 0 3px 12px rgba(0,0,0,0.06);
    }

    .stat-card h3 {
      font-size: 14px;
      color: #666;
      margin-bottom: 8px;
    }

    .stat-card strong {
      font-size: 25px;
    }

    @media (max-width: 650px) {
      .stats {
        grid-template-columns: 1fr;
      }

      .container {
        width: 92%;
      }
    }
  </style>
</head>

<body>

<header>
  <h1>SB Tournament</h1>
  <p>Payment Verification Panel — P3</p>
</header>

<div class="container">

  <div id="successMessage" class="message success"></div>
  <div id="errorMessage" class="message error"></div>

  <div class="top-bar">
    <h2>Payment Management</h2>
    <button class="refresh" onclick="loadPayments()">
      ↻ Refresh
    </button>
  </div>

  <div class="stats">

    <div class="stat-card">
      <h3>Pending</h3>
      <strong id="pendingCount">0</strong>
    </div>

    <div class="stat-card">
      <h3>Approved</h3>
      <strong id="approvedCount">0</strong>
    </div>

    <div class="stat-card">
      <h3>Rejected</h3>
      <strong id="rejectedCount">0</strong>
    </div>

  </div>

  <div class="table-box">

    <div id="loading" class="loading">
      Loading payments...
    </div>

    <table id="paymentTable" style="display:none;">

      <thead>
        <tr>
          <th>ID</th>
          <th>Player</th>
          <th>Phone</th>
          <th>Method</th>
          <th>Transaction ID</th>
          <th>Amount</th>
          <th>Status</th>
          <th>Date</th>
          <th>Action</th>
        </tr>
      </thead>

      <tbody id="paymentBody"></tbody>

    </table>

    <div id="emptyBox" class="empty" style="display:none;">
      No payments found.
    </div>

  </div>

</div>

<script>

  /* ========================================
     SUPABASE CONFIGURATION
     ======================================== */

  const SUPABASE_URL =
    "https://ofcpuiubovcjxucqynyw.supabase.co";

  const SUPABASE_PUBLISHABLE_KEY =
    "sb_publishable_NpG4P_VRdesJJkkzuBoanw_mbM3ivFS";

  const supabaseClient =
    supabase.createClient(
      SUPABASE_URL,
      SUPABASE_PUBLISHABLE_KEY
    );


  /* ========================================
     LOAD PAYMENTS
     ======================================== */

  async function loadPayments() {

    const loading =
      document.getElementById("loading");

    const table =
      document.getElementById("paymentTable");

    const emptyBox =
      document.getElementById("emptyBox");

    const body =
      document.getElementById("paymentBody");

    loading.style.display = "block";
    table.style.display = "none";
    emptyBox.style.display = "none";

    hideMessages();

    const { data, error } =
      await supabaseClient
        .from("payments")
        .select("*")
        .order("created_at", {
          ascending: false
        });

    loading.style.display = "none";

    if (error) {

      showError(
        "Payment load failed: " +
        error.message
      );

      console.error(error);
      return;
    }

    updateStats(data || []);

    body.innerHTML = "";

    if (!data || data.length === 0) {

      emptyBox.style.display = "block";
      return;
    }

    table.style.display = "table";

    data.forEach(payment => {

      const row =
        document.createElement("tr");

      const status =
        payment.status || "pending";

      const statusClass =
        String(status).toLowerCase();

      const createdDate =
        payment.created_at
          ? new Date(
              payment.created_at
            ).toLocaleString()
          : "-";

      row.innerHTML = `

        <td>
          ${escapeHTML(payment.id)}
        </td>

        <td>
          ${escapeHTML(
            payment.player_name ||
            payment.name ||
            "-"
          )}
        </td>

        <td>
          ${escapeHTML(
            payment.phone ||
            payment.mobile ||
            "-"
          )}
        </td>

        <td>
          ${escapeHTML(
            payment.payment_method ||
            payment.method ||
            "-"
          )}
        </td>

        <td>
          ${escapeHTML(
            payment.transaction_id ||
            payment.txn_id ||
            "-"
          )}
        </td>

        <td>
          ${escapeHTML(
            payment.amount || "-"
          )}
        </td>

        <td>
          <span class="status ${statusClass}">
            ${escapeHTML(status)}
          </span>
        </td>

        <td>
          ${escapeHTML(createdDate)}
        </td>

        <td>

          ${
            statusClass === "pending"

            ? `

              <button
                class="approve"
                onclick="updatePayment(
                  '${escapeHTML(payment.id)}',
                  'approved'
                )">
                Approve
              </button>

              <button
                class="reject"
                onclick="updatePayment(
                  '${escapeHTML(payment.id)}',
                  'rejected'
                )">
                Reject
              </button>

            `

            : "Completed"
          }

        </td>
      `;

      body.appendChild(row);

    });

  }


  /* ========================================
     APPROVE / REJECT PAYMENT
     ======================================== */

  async function updatePayment(
    id,
    newStatus
  ) {

    const actionText =
      newStatus === "approved"
        ? "approve"
        : "reject";

    if (
      !confirm(
        "Are you sure you want to " +
        actionText +
        " this payment?"
      )
    ) {
      return;
    }

    hideMessages();

    const { error } =
      await supabaseClient
        .from("payments")
        .update({
          status: newStatus
        })
        .eq("id", id);

    if (error) {

      showError(
        "Update failed: " +
        error.message
      );

      console.error(error);
      return;
    }

    showSuccess(
      "Payment " +
      newStatus +
      " successfully."
    );

    await loadPayments();
  }


  /* ========================================
     STATISTICS
     ======================================== */

  function updateStats(payments) {

    let pending = 0;
    let approved = 0;
    let rejected = 0;

    payments.forEach(payment => {

      const status =
        String(
          payment.status || "pending"
        ).toLowerCase();

      if (status === "pending") {
        pending++;
      }

      if (status === "approved") {
        approved++;
      }

      if (status === "rejected") {
        rejected++;
      }

    });

    document.getElementById(
      "pendingCount"
    ).textContent = pending;

    document.getElementById(
      "approvedCount"
    ).textContent = approved;

    document.getElementById(
      "rejectedCount"
    ).textContent = rejected;
  }


  /* ========================================
     HTML ESCAPE
     ======================================== */

  function escapeHTML(value) {

    if (
      value === null ||
      value === undefined
    ) {
      return "";
    }

    return String(value)
      .replace(/&/g, "&amp;")
      .replace(/</g, "&lt;")
      .replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;")
      .replace(/'/g, "&#039;");
  }


  /* ========================================
     MESSAGES
     ======================================== */

  function showSuccess(message) {

    const box =
      document.getElementById(
        "successMessage"
      );

    box.textContent = message;
    box.style.display = "block";
  }


  function showError(message) {

    const box =
      document.getElementById(
        "errorMessage"
      );

    box.textContent = message;
    box.style.display = "block";
  }


  function hideMessages() {

    document.getElementById(
      "successMessage"
    ).style.display = "none";

    document.getElementById(
      "errorMessage"
    ).style.display = "none";
  }


  /* ========================================
     START
     ======================================== */

  loadPayments();

</script>

</body>
  </html>
