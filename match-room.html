<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>SB Tournament - P9</title>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
    font-family:Arial,sans-serif;
}

body{
    background:#f4f6fb;
    color:#222;
}

.header{
    background:#171a2b;
    color:white;
    padding:22px 15px;
    text-align:center;
}

.header h1{
    font-size:25px;
    margin-bottom:6px;
}

.container{
    width:94%;
    max-width:900px;
    margin:25px auto;
}

.card{
    background:white;
    padding:20px;
    border-radius:15px;
    box-shadow:0 4px 15px rgba(0,0,0,.08);
}

.refresh{
    width:100%;
    margin-top:15px;
    padding:12px;
    border:0;
    border-radius:9px;
    background:#2563eb;
    color:white;
    font-weight:bold;
    cursor:pointer;
}

.match{
    border:1px solid #e5e7eb;
    border-radius:13px;
    padding:17px;
    margin-top:15px;
}

.match h3{
    margin-bottom:10px;
}

.status{
    display:inline-block;
    background:#fff7ed;
    color:#c2410c;
    padding:5px 10px;
    border-radius:20px;
    font-size:13px;
    font-weight:bold;
}

.info{
    line-height:1.9;
    color:#555;
    margin-top:10px;
}

.room-box{
    background:#f8fafc;
    padding:13px;
    border-radius:10px;
    margin-top:12px;
}

.copy{
    border:0;
    border-radius:7px;
    padding:9px 12px;
    margin-top:7px;
    background:#16a34a;
    color:white;
    font-weight:bold;
    cursor:pointer;
}

.empty{
    text-align:center;
    padding:30px 5px;
    color:#777;
}
